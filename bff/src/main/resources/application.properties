##
## BFF ? Application Properties
##
## Syfte: Konfigurerar BFF-processens portar och bas?URL:er till bakomliggande tjänster
## (auth, user, message). Dessa används av BffProxyController när den vidarebefordrar
## anrop från klienten till interna mikrotjänster.

# HTTP?port för BFF:n
server.port=8080

# Bas?URL till Auth?tjänsten (för /api/login)
services.auth.base-url=http://localhost:8081

# Bas?URL till User?tjänsten (för /api/users...)
services.user.base-url=http://localhost:8082

# Bas?URL till Message?tjänsten (för /api/messages...)
services.message.base-url=http://localhost:8083
