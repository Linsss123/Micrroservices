##
## Message Service ? Application Properties
##
## Syfte: Konfigurerar HTTP?porten för Message?tjänsten samt RabbitMQ?anslutning
## och MQ?topologi (exchange, routing?nyckel, kö). Dessa värden används av
## MessageMqConfig och MessageController för att publicera händelser.

# HTTP?port för Message?tjänsten
server.port=8083

# RabbitMQ?anslutning (demo?standard). Byt vid behov för icke?lokal broker.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# MQ?inställningar för eventet "message-published"
app.mq.exchange=chat.exchange      # Topic Exchange som tar emot publiceringar
app.mq.routing-key=message.published  # Routing?nyckel som används vid publicering
app.mq.queue=chat.bot              # Exempelkö som binds till exchanget

# Datasource (MySQL i Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/microdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=appuser
spring.datasource.password=apppass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
