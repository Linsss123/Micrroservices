##
## User Service ? Application Properties
##
## Syfte: Anger HTTP?porten för User?tjänsten. BFF proxar /api/users...
## vidare till denna tjänst på angiven port.

# HTTP?port för User?tjänsten
server.port=8082

# Datasource (MySQL i Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/microdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=appuser
spring.datasource.password=apppass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
