##
## Docker Compose för lokalt demo‑körscenario
##
## Syfte:
## - Startar en RabbitMQ‑instans lokalt så att Message‑tjänsten kan publicera
##   händelsen "message-published" till en Topic Exchange.
## - Management UI exponeras på port 15672 (inlogg: guest/guest) för att enkelt
##   kunna inspektera köer, exchangear och meddelanden vid utveckling.
##
## Användning:
##   docker compose up -d
##   docker compose down
##
services:
  rabbitmq:
    image: rabbitmq:3-management      # Officiell RabbitMQ‑image med webb‑UI
    ports:
      - "5672:5672"    # AMQP port som applikationer använder
      - "15672:15672"  # RabbitMQ Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest    # Demo‑inlogg (byt i produktion)
      RABBITMQ_DEFAULT_PASS: guest    # Demo‑lösen (byt i produktion)